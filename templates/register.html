{% extends "base.html" %} {% block title %}Register - NetScan{% endblock %} {%
block content %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="glass-card p-8 text-center">
      <div class="mb-8">
        <div
          class="w-20 h-20 bg-gradient-to-r from-purple-500 to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4"
        >
          <span class="text-white text-4xl">🔍</span>
        </div>
        <h1 class="text-4xl font-bold gradient-text mb-2">NetScan</h1>
        <p class="text-gray-400">Create Your Account</p>
      </div>

      {% if error %}
      <div
        class="bg-red-500/20 border border-red-500/50 text-red-300 px-4 py-3 rounded-lg mb-6"
      >
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" class="space-y-5">
        <input
          type="text"
          name="username"
          required
          class="input-field"
          placeholder="Username"
        />
        <input
          type="password"
          name="password"
          required
          class="input-field"
          placeholder="Password"
        />
        <input
          type="password"
          name="confirm_password"
          required
          class="input-field"
          placeholder="Confirm Password"
        />
        <button
          type="submit"
          class="btn-primary w-full py-3 rounded-xl font-semibold text-white"
        >
          Create Account
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-gray-700">
        <p class="text-gray-400 text-sm">
          Already have an account?
          <a
            href="{{ url_for('auth.login') }}"
            class="text-purple-400 hover:text-purple-300 transition"
            >Sign in</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
