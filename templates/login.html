{% extends "base.html" %}

{% block title %}Login - Network Port Scanner{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-800 px-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-blue-600 mb-2">🔍 NetScan</h1>
                <p class="text-gray-600">Smart Network Port Monitoring</p>
            </div>

            {% if error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" name="username" required class="input-field" placeholder="Enter your username">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required class="input-field" placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-primary w-full font-semibold">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600">Don't have an account? 
                    <a href="{{ url_for('auth.register') }}" class="text-blue-600 font-semibold hover:underline">Create one</a>
                </p>
            </div>
        </div>

        <div class="mt-8 bg-blue-900 bg-opacity-50 rounded-lg p-6 text-white text-center">
            <p class="text-sm">Demo credentials: admin / password</p>
        </div>
    </div>
</div>
{% endblock %}
