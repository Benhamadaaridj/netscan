<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetScan - Modern Port Scanner{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            transition: all 0.3s ease;
        }
        
        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2);
        }
        
        .btn-modern {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }
        
        .btn-outline-modern {
            background: transparent;
            border: 1px solid rgba(139, 92, 246, 0.5);
            transition: all 0.3s ease;
        }
        
        .btn-outline-modern:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: scale(1.05);
            border-color: #8b5cf6;
        }
        
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .input-modern {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-modern:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        
        .badge-critical { background: linear-gradient(135deg, #dc2626, #991b1b); }
        .badge-high { background: linear-gradient(135deg, #f97316, #ea580c); }
        .badge-medium { background: linear-gradient(135deg, #eab308, #ca8a04); }
        .badge-low { background: linear-gradient(135deg, #22c55e, #15803d); }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if 'user_id' in session %}
    <nav class="glass-card mx-6 mt-4 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-r from-purple-500 to-blue-500 rounded-xl flex items-center justify-center">
                    <span class="text-white text-xl">🔍</span>
                </div>
                <a href="{{ url_for('dashboard.index') }}" class="text-2xl font-bold gradient-text">NetScan</a>
            </div>
            <div class="hidden md:flex gap-8">
                <a href="{{ url_for('dashboard.index') }}" class="nav-link text-gray-300 hover:text-white">Dashboard</a>
                <a href="{{ url_for('dashboard.scans') }}" class="nav-link text-gray-300 hover:text-white">Scans</a>
                <a href="{{ url_for('dashboard.alerts') }}" class="nav-link text-gray-300 hover:text-white">Alerts</a>
                <a href="{{ url_for('dashboard.comparisons') }}" class="nav-link text-gray-300 hover:text-white">Comparisons</a>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-300">👤 {{ session.get('username', 'User') }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn-outline-modern px-4 py-2 rounded-lg text-sm text-white">Logout</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-6 text-gray-500 text-sm">
        <p>&copy; 2025 NetScan - Advanced Network Port Monitoring System</p>
    </footer>
</body>
</html>
