<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Port Scanner{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #1f4e79;
            --primary-light: #2e5fa1;
            --accent: #e74c3c;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #c0392b;
            --neutral-light: #ecf0f1;
            --neutral-dark: #2c3e50;
        }
        
        body {
            background-color: #f8fafc;
            color: var(--neutral-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors;
        }
        
        .btn-secondary {
            @apply bg-gray-200 hover:bg-gray-300 text-gray-900 px-4 py-2 rounded-lg transition-colors;
        }
        
        .btn-danger {
            @apply bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors;
        }
        
        .badge-critical {
            @apply bg-red-100 text-red-800 px-3 py-1 rounded-full text-sm font-semibold;
        }
        
        .badge-high {
            @apply bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-sm font-semibold;
        }
        
        .badge-medium {
            @apply bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-semibold;
        }
        
        .badge-low {
            @apply bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-semibold;
        }
        
        .card {
            @apply bg-white rounded-lg shadow-sm border border-gray-200 p-6;
        }
        
        .table {
            @apply w-full border-collapse;
        }
        
        .table thead {
            @apply bg-gray-50 border-b border-gray-200;
        }
        
        .table th {
            @apply px-4 py-3 text-left text-sm font-semibold text-gray-700;
        }
        
        .table td {
            @apply px-4 py-3 text-sm border-b border-gray-100;
        }
        
        .table tbody tr:hover {
            @apply bg-gray-50;
        }
        
        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if 'user_id' in session %}
    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <a href="{{ url_for('dashboard.index') }}" class="text-xl font-bold">🔍 NetScan</a>
                <div class="flex gap-6">
                    <a href="{{ url_for('dashboard.index') }}" class="hover:text-blue-100 transition">Dashboard</a>
                    <a href="{{ url_for('dashboard.scans') }}" class="hover:text-blue-100 transition">Scans</a>
                    <a href="{{ url_for('dashboard.alerts') }}" class="hover:text-blue-100 transition">Alerts</a>
                    <a href="{{ url_for('dashboard.comparisons') }}" class="hover:text-blue-100 transition">Comparisons</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm">{{ session.get('username', 'User') }}</span>
                <a href="{{ url_for('auth.logout') }}" class="btn-secondary text-sm">Logout</a>
            </div>
        </div>
    </nav>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-gray-300 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2024 Network Port Scanner. All rights reserved.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
