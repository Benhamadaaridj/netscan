<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - NetScan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-600 to-blue-800">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-xl shadow-2xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-blue-600 mb-2">🔍 NetScan</h1>
                    <p class="text-gray-600">نظام فحص المنافذ المتقدم</p>
                </div>

                {% if error %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">اسم المستخدم</label>
                        <input type="text" name="username" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">كلمة المرور</label>
                        <input type="password" name="password" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
                        دخول
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600">ليس لديك حساب؟ 
                        <a href="{{ url_for('auth.register') }}" class="text-blue-600 font-semibold hover:underline">أنشئ حساباً</a>
                    </p>
                </div>

                <div class="mt-4 text-center text-sm text-gray-500">
                    بيانات الدخول التجريبية: <strong class="font-mono">admin / password</strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
